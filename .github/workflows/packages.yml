name: Node PR Lint, Build and Test

on:
  # Trigger on pull requests to `main` or `rel/*`
  pull_request:
    branches:
      - main
      - rel/*

jobs:
  ChangedPackages:
    # Determine changed subpaths to run the matrix on
    # See https://github.com/dorny/paths-filter/tree/v4/#examples
    runs-on: ubuntu-latest
    steps:
      - name: Determine changed packages
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            appservice: "appservice/**"
            appsettings: "appsettings/**"
            auth: "auth/**"
            azure: "azure/**"
            eng: "eng/**"
            github: "github/**"
            utils: "utils/**"
            webview: "webview/**"
    outputs:
      # Expose matched filters as job 'packages' output variable
      packages: ${{ steps.filter.outputs.changes }}

  Build:
    if: ${{ fromJson(needs.ChangedPackages.outputs.packages)[0] != null }}
    needs: [ChangedPackages]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.ChangedPackages.outputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Using Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run package
      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "Artifacts-${{ matrix.package }}"
          path: |
            **/*.vsix
            **/*.tgz
            !**/node_modules
          if-no-files-found: error
      - run: xvfb-run -a npm test

  CheckResults: # required for GtiHub PR rules
    # Require all jobs under `build` to have succeeded
    # See https://github.com/orgs/community/discussions/26822
    if: ${{ always() }}
    needs: [Build, ChangedPackages]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ (fromJson(needs.ChangedPackages.outputs.packages)[0] != null) && contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
