parameters:
  # Base URL of an Azure Artifacts universal feed (e.g. https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/azcode).
  # Used to write a build-time .npmrc (registry "<feedBaseUrl>/npm/registry/")
  # when the repo doesn't check one in, so both npm and pnpm install from the
  # internal mirror.
  - name: feedBaseUrl
    type: string
    default: ""

steps:
  - pwsh: |
      $nvmrcPath = "$(working_directory)/.nvmrc"
      if (-not (Test-Path $nvmrcPath)) {
        $nvmrcPath = "$(Build.SourcesDirectory)/.nvmrc"
      }
      if (-not (Test-Path $nvmrcPath)) {
        Write-Output "##vso[task.logissue type=error].nvmrc file not found in $(working_directory) or repo root. Please add a .nvmrc file."
        exit 1
      }
      $nodeVersion = (Get-Content $nvmrcPath).Trim()
      Write-Output "##vso[task.setvariable variable=nodeVersion]$nodeVersion"
    displayName: "👉 Read Node version from .nvmrc"

  - task: UseNode@1
    displayName: "👉 Using Node.js"
    inputs:
      version: $(nodeVersion)

  # Authenticate before bootstrapping pnpm so the bootstrap uses the same registry
  # as dependency installation.
  - template: write-npmrc-auth.yml
    parameters:
      workingDirectory: $(working_directory)
      feedBaseUrl: ${{ parameters.feedBaseUrl }}

  # Activate the version pinned by package.json via npm instead of Corepack,
  # whose downloader bypasses .npmrc and fails on network-restricted agents.
  - pwsh: |
      $pm = (Get-Content "package.json" -Raw | ConvertFrom-Json).packageManager
      if (-not $pm -or -not $pm.StartsWith("pnpm@")) {
        Write-Output "##vso[task.logissue type=error]package.json 'packageManager' must be 'pnpm@<version>' when packageManager is pnpm."
        exit 1
      }
      # Strip the "pnpm@" prefix and any "+<hash>" integrity suffix -> bare version.
      $pnpmVersion = ($pm -replace '^pnpm@', '') -replace '\+.*$', ''
      # Drop any Corepack pnpm shim first so the globally installed pnpm wins on PATH.
      corepack disable pnpm 2>$null
      npm install -g "pnpm@$pnpmVersion"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      node --version
      pnpm --version
    displayName: "👉 Activate pnpm"
    workingDirectory: $(working_directory)
    condition: and(succeeded(), eq(variables['packageManager'], 'pnpm'))
    # Global installs ignore project .npmrc files; use the authenticated file as user config.
    env:
      NPM_CONFIG_USERCONFIG: $(npmrcFile)

  - pwsh: $(packageManager) ci
    displayName: "👉 Install Dependencies"
    workingDirectory: $(working_directory)
