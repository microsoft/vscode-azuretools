parameters:
  - name: signType
    type: string
    values:
      - test
      - real

steps:
  # Eww, but DDSignFiles.dll requires .NET Core 3.1
  - task: UseDotNet@2
    displayName: "👉 Signing: Install .NET Core 3.1"
    inputs:
      packageType: sdk
      version: 3.1.x

  # ...and the actual PME signing tool requires .NET 8
  - task: UseDotNet@2
    displayName: "👉 Signing: Install .NET 8"
    inputs:
      packageType: sdk
      version: 8.x

  - template: ./find-vsixs.yml

  - template: ./set-npm-before-date.yml

  # Global installs ignore project .npmrc files, so use the authenticated file as user config.
  - pwsh: npm install --global --omit=optional --before $(npmBeforeDate) @vscode/vsce@latest
    displayName: "👉 Install vsce"
    env:
      NPM_CONFIG_USERCONFIG: $(npmrcFile)

  - pwsh: |
      $vsixList = '$(vsixListJson)' | ConvertFrom-Json
      $fileListObject = @{
          SignFileRecordList = @(
              @{
                  SignFileList = @()
                  Certs = "4014052" # This is the VSCode publisher signing cert number
              }
          )
      }

      foreach ($vsix in $vsixList) {
          Set-Location $vsix.directory

          # Generate manifest
          Write-Output "Generating manifest for $($vsix.vsixName)..."
          & vsce generate-manifest -i $vsix.vsixName -o $vsix.manifestName
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to generate manifest for $($vsix.vsixName)"
              exit 1
          }

          # Copy the manifest to the soon-to-be-signed signature file
          Copy-Item $vsix.manifestName $vsix.signatureName

          # Add to the list of files to sign
          $srcPath = Join-Path $vsix.directory $vsix.signatureName
          $fileListObject.SignFileRecordList[0].SignFileList += @{
              SrcPath = $srcPath
              DstPath = $null
          }
      }

      # Write out the file list to sign
      $fileListObject | ConvertTo-Json -Depth 4 | Out-File -FilePath $(Build.SourcesDirectory)/filesToSign.json
    displayName: "👉 Prepare VSIXs for signing"

  - pwsh: |
      & dotnet $env:MBSIGN_APPFOLDER/DDSignFiles.dll ${{ iif(eq(parameters.signType, 'test'), '/test', '') }} -- /filelist:$(Build.SourcesDirectory)/filesToSign.json
    displayName: "👉 Sign VSIX signature files"
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
